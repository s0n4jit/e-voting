# ==============================================================================
# Campus E-Voting - Caddy Local HTTPS Reverse Proxy Compose Overlay
# ==============================================================================
# Run from repository root:
#   docker compose -f docker-compose.yml -f deployment/local-network/docker-compose.caddy.yml up -d
# ==============================================================================

services:
  caddy:
    image: caddy:2-alpine
    container_name: evoting-caddy-1
    restart: unless-stopped
    depends_on:
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deployment/local-network/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
