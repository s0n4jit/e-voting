# Serves the landing page and guides (docs/) with the same clean URLs as GitHub Pages: /guide, /self-hosting, /team.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
    location ~* \.(md|svg|css|js)$ {
        add_header Cache-Control "no-cache";
    }
}
