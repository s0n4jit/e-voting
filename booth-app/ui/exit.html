<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Officer code</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'">
<link rel="stylesheet" href="ui.css"></head><body style="padding:22px"><main>
<h1>Election Officer code</h1>
<p class="sub">Enter the current 6-digit code from the officer's authenticator app to leave the booth.</p>
<input id="code" type="password" inputmode="numeric" maxlength="8" placeholder="123456" autocomplete="off" autofocus>
<div class="msg err" id="msg"></div>
<button id="ok" type="button">Unlock</button><button id="cancel" class="alt" type="button">Cancel</button>
</main><script src="exit.js"></script></body></html>
