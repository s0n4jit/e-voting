<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Booth setup</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'">
<link rel="stylesheet" href="ui.css"></head><body><main>
<h1>Voting booth setup</h1>
<p class="sub">Enter the portal address and choose the printer. You can open this again from the maintenance screen.</p>
<label for="url">Portal address (ends with /kiosk/vote)</label>
<input id="url" type="text" placeholder="https://vote.example.edu/kiosk/vote" autocomplete="off">
<label for="printer">Printer for the vote copy</label>
<select id="printer"></select>
<button class="alt" id="test" type="button">Print a test page</button>
<label><input id="auto" type="checkbox" checked>Start this app automatically when the computer starts</label>
<div class="msg" id="msg"></div>
<button id="save" type="button">Save and start voting</button>
<p class="sub" style="margin-top:22px">To leave the full-screen booth later press <b>Ctrl+Alt+Shift+Q</b> and enter the Election Officer's authenticator code.</p>
</main><script src="setup.js"></script></body></html>
