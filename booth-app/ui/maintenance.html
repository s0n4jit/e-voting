<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Booth maintenance</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'">
<link rel="stylesheet" href="ui.css"></head><body><main>
<h1>Booth maintenance</h1>
<p class="sub">The booth is unlocked. It returns to voting by itself after 15 minutes.</p>
<div class="card">
  <button id="resume" type="button">Return to voting</button>
  <button id="setup" class="alt" type="button">Address and printer</button>
  <button id="receipts" class="alt" type="button">Open saved receipts</button>
  <button id="mockReceipts" class="alt" type="button">Open mock election receipts</button>
  <button id="checkUpdate" class="alt" type="button">Check for app updates</button>
  <div id="updateMsg" class="sub" style="margin:4px 0 0;font-size:12px;display:none;"></div>
  <button id="quit" class="bad" type="button">Quit the app</button>
</div>
</main><script src="maintenance.js"></script></body></html>
