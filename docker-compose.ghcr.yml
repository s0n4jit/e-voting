# Self-host WITHOUT building: uses the images published by .github/workflows/docker-publish.yml.
#   cp .env.example .env   # fill it in
#   docker compose -f docker-compose.ghcr.yml up -d
# Update later with:  docker compose -f docker-compose.ghcr.yml pull && docker compose -f docker-compose.ghcr.yml up -d
# Set IMAGE_TAG (default latest) to pin a release, e.g. IMAGE_TAG=1.0.0.
name: evoting

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-evoting}
      POSTGRES_USER: ${POSTGRES_USER:-evoting}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    image: ghcr.io/s0n4jit/e-voting-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      FLASK_ENV: production
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      DATABASE_URL: postgresql://${POSTGRES_USER:-evoting}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-evoting}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      PROXY_HOPS: ${PROXY_HOPS:-1}
    volumes:
      - backend_logs:/app/logs
    ports:
      - "127.0.0.1:${API_PORT:-5000}:5000"  # direct API access from this machine only

  frontend:
    image: ghcr.io/s0n4jit/e-voting-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  db_data:
  backend_logs:
