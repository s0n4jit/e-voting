# Self-hosted deployment / local run of everything. Fixed ports (change them in .env):
#   App (web + API)  http://localhost:8080   WEB_PORT
#   Landing page     http://localhost:8081   SITE_PORT   (the same site as GitHub Pages)
#   API directly     http://localhost:5000   API_PORT    (localhost only)
# First run:  python scripts/make_env.py && docker compose up -d --build
# See docs/INSTALLATION.md. For a throwaway local test instance use testing/local/ instead.
name: evoting

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-evoting}
      POSTGRES_USER: ${POSTGRES_USER:-evoting}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      FLASK_ENV: production
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      DATABASE_URL: postgresql://${POSTGRES_USER:-evoting}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-evoting}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      PROXY_HOPS: ${PROXY_HOPS:-1}
    volumes:
      - backend_logs:/app/logs
    ports:
      - "127.0.0.1:${API_PORT:-5000}:5000"  # direct API access from this machine only

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-8080}:80"

  site:
    image: nginx:1.25-alpine
    restart: unless-stopped
    volumes:
      - ./docs:/usr/share/nginx/html:ro
      - ./scripts/site.nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${SITE_PORT:-8081}:80"

volumes:
  db_data:
  backend_logs:
