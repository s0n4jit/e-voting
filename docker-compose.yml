# Self-hosted deployment. Copy .env.example to .env, fill it in, then:  docker compose up -d --build
# See docs/INSTALLATION.md. For a throwaway local test instance use testing/local/ instead.
name: evoting

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-evoting}
      POSTGRES_USER: ${POSTGRES_USER:-evoting}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      FLASK_ENV: production
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      DATABASE_URL: postgresql://${POSTGRES_USER:-evoting}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-evoting}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      PROXY_HOPS: ${PROXY_HOPS:-1}
    volumes:
      - backend_logs:/app/logs
    expose:
      - "5000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-80}:80"

volumes:
  db_data:
  backend_logs:
