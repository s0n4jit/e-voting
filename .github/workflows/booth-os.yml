name: Build Booth OS

# Builds the Campus E-Voting Booth OS ISO (Debian live image: Cage + Firefox kiosk) and attaches it to a GitHub Release.
# Run it from the Actions tab, or push a tag such as booth-os-v1.0.0.
on:
  workflow_dispatch:
  push:
    tags: ["booth-os-v*"]

permissions:
  contents: write

jobs:
  iso:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install live-build
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap debian-archive-keyring xorriso squashfs-tools \
            mtools dosfstools syslinux-common isolinux grub-efi-amd64-bin grub-pc-bin
      - name: Build the image
        working-directory: booth-os
        run: |
          cp ../kiosk/ubuntu/policies/policies.json config/includes.chroot/usr/share/evote/policies.base.json
          chmod +x auto/config config/hooks/normal/*.chroot config/includes.chroot/usr/local/bin/*
          sudo sh build.sh
          ISO=$(ls *.iso | head -n 1)
          sudo mv "$ISO" evote-booth-os.iso
          sudo chown "$USER" evote-booth-os.iso
          sha256sum evote-booth-os.iso | tee evote-booth-os.iso.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: evote-booth-os
          path: |
            booth-os/evote-booth-os.iso
            booth-os/evote-booth-os.iso.sha256
          retention-days: 14
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Booth OS $GITHUB_REF_NAME" --notes "Bootable booth image. Put your portal address into it with embed-url.py, then write it to a USB stick. See docs/BOOTH_OS.md."
          gh release upload "$GITHUB_REF_NAME" booth-os/evote-booth-os.iso booth-os/evote-booth-os.iso.sha256 --clobber
