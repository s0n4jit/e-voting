name: Booth app

# Builds the Campus E-Voting Booth desktop app (Windows installer, Linux AppImage and .deb).
# Run it by hand (Actions -> Booth app -> Run workflow) or push a tag like booth-app-v1.0.0 to also attach the files to a release.
on:
  workflow_dispatch:
  push:
    tags: ['booth-app-v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: booth-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: booth-app/package-lock.json
      - run: npm ci
      - run: node node_modules/electron/install.js   # npm does not run Electron's download script by itself
      - run: npm test
      - run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: booth-app-${{ matrix.os }}
          path: |
            booth-app/dist/*.exe
            booth-app/dist/*.AppImage
            booth-app/dist/*.deb
      - if: startsWith(github.ref, 'refs/tags/booth-app-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            booth-app/dist/*.exe
            booth-app/dist/*.AppImage
            booth-app/dist/*.deb
