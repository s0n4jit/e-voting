name: Booth app

# Builds the Campus E-Voting Booth desktop app (Windows installer, Linux AppImage and .deb).
# Run it by hand (Actions -> Booth app -> Run workflow) or push a tag like booth-app-v1.0.0.
# The files are published as the release "booth-app-latest", which the officer panel links to.
on:
  workflow_dispatch:
  push:
    tags: ['booth-app-v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: booth-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: booth-app/package-lock.json
      - run: npm ci
      - run: node node_modules/electron/install.js   # npm does not run Electron's download script by itself
      - run: npm test
      - run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: booth-app-${{ matrix.os }}
          path: |
            booth-app/dist/*.exe
            booth-app/dist/*.AppImage
            booth-app/dist/*.deb

  # Publish the files under a fixed release tag so the officer panel can link to stable download addresses:
  # https://github.com/<owner>/<repo>/releases/download/booth-app-latest/<file>
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - name: Replace the booth-app-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la files
          gh release delete booth-app-latest --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
          gh release create booth-app-latest files/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Booth app (latest build)" --prerelease --latest=false \
            --notes "Windows installer, Ubuntu .deb and Linux AppImage of the Campus E-Voting Booth app. Built from $GITHUB_SHA."
