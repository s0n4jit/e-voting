</div></footer>

<script>
const DOCS = [
  ['INSTALLATION', 'Installation (own server)'],
  ['FREE_HOSTING', 'Free hosting (Render + Supabase)'],
  ['DEPLOYMENT', 'Deployment'],
  ['OPERATIONS', 'Operations and backups'],
  ['USER_GUIDE', 'User guide'],
  ['KIOSK_SETUP', 'Voting booth setup'],
  ['BOOTH_OS', 'Booth OS (bootable USB)'],
  ['KIOSK_MAINTENANCE', 'Booth maintenance'],
  ['SECURITY', 'Security'],
  ['TROUBLESHOOTING', 'Troubleshooting'],
  ['CHANGELOG', 'Changelog'],
];
const REPO = 'https://github.com/s0n4jit/e-voting/blob/main/';
const names = DOCS.map(d => d[0]);
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const slug = s => s.toLowerCase().replace(/<[^>]+>/g, '').replace(/[^\w\s-]/g, '').trim().replace(/\s+/g, '-');

function fixHref(h) {
  if (/^(https?:|mailto:|#)/.test(h)) return h;
  const m = h.match(/^(?:\.\/)?([A-Z_]+)\.md(#.*)?$/);
  if (m && names.includes(m[1])) return 'guide?doc=' + m[1] + (m[2] || '');
  const path = h.startsWith('../') ? h.slice(3) : 'docs/' + h.replace(/^\.\//, '');
  return REPO + path;
}

function inline(s) {
  const codes = [];
  s = s.replace(/`([^`]+)`/g, (_, c) => { codes.push(c); return '\u0000' + (codes.length - 1) + '\u0000'; });
  s = esc(s)
    .replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img alt="$1" src="$2">')
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_, t, h) => '<a href="' + fixHref(h) + '">' + t + '</a>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[\s(])\*([^*\s][^*]*)\*(?=[\s).,;:]|$)/g, '$1<em>$2</em>');
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => '<code>' + esc(codes[i]) + '</code>');
}

function render(md) {
  const lines = md.replace(/\r/g, '').split('\n');
  let out = '', i = 0;
  const isTableSep = l => /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(l);
  const cells = l => l.trim().replace(/^\|/, '').replace(/\|$/, '').split(/(?<!\\)\|/).map(c => c.trim().replace(/\\\|/g, '|'));
  while (i < lines.length) {
    const l = lines[i];
    let m;
    if ((m = l.match(/^```(\w*)/))) {
      const buf = [];
      for (i++; i < lines.length && !lines[i].startsWith('```'); i++) buf.push(lines[i]);
      i++;
      out += '<pre><code>' + esc(buf.join('\n')) + '</code></pre>';
    } else if ((m = l.match(/^(#{1,4})\s+(.*)$/))) {
      const n = m[1].length, t = inline(m[2]);
      out += '<h' + n + ' id="' + slug(m[2]) + '">' + t + '</h' + n + '>';
      i++;
    } else if (/^\s*---+\s*$/.test(l)) { out += '<hr>'; i++; }
    else if (l.includes('|') && i + 1 < lines.length && isTableSep(lines[i + 1])) {
      const head = cells(l);
      i += 2;
      let rows = '';
      for (; i < lines.length && lines[i].includes('|') && lines[i].trim(); i++)
        rows += '<tr>' + cells(lines[i]).map(c => '<td>' + inline(c) + '</td>').join('') + '</tr>';
      out += '<div class="tw"><table><thead><tr>' + head.map(c => '<th>' + inline(c) + '</th>').join('') + '</tr></thead><tbody>' + rows + '</tbody></table></div>';
    } else if (/^>\s?/.test(l)) {
      const buf = [];
      for (; i < lines.length && /^>\s?/.test(lines[i]); i++) buf.push(lines[i].replace(/^>\s?/, ''));
      out += '<blockquote>' + inline(buf.join(' ')) + '</blockquote>';
    } else if (/^\s*([-*]|\d+\.)\s+/.test(l)) {
      const ordered = /^\s*\d+\./.test(l);
      let items = [];
      while (i < lines.length && (/^\s*([-*]|\d+\.)\s+/.test(lines[i]) || (/^\s{2,}\S/.test(lines[i]) && items.length) || (!lines[i].trim() && /^\s*([-*]|\d+\.)\s+|^\s{2,}\S/.test(lines[i + 1] || '') && items.length))) {
        const lm = lines[i].match(/^\s*(?:[-*]|\d+\.)\s+(.*)$/);
        if (lm && !/^\s{4,}/.test(lines[i])) items.push(lm[1]);
        else if (lines[i].trim()) {
          if (/^\s*```/.test(lines[i])) { // fenced block inside a list item
            const buf = [];
            for (i++; i < lines.length && !/^\s*```/.test(lines[i]); i++) buf.push(lines[i].replace(/^\s{2,4}/, ''));
            items[items.length - 1] += '\u0001<pre><code>' + esc(buf.join('\n')) + '</code></pre>';
          } else items[items.length - 1] += ' ' + lines[i].trim();
        }
        i++;
      }
      const tag = ordered ? 'ol' : 'ul';
      out += '<' + tag + '>' + items.map(t => { const [a, ...r] = t.split('\u0001'); return '<li>' + inline(a) + r.join('') + '</li>'; }).join('') + '</' + tag + '>';
    } else if (!l.trim()) i++;
    else {
      const buf = [];
      for (; i < lines.length && lines[i].trim() && !/^(#{1,4}\s|```|>|\s*([-*]|\d+\.)\s)/.test(lines[i]) && !(lines[i].includes('|') && isTableSep(lines[i + 1] || '')); i++) buf.push(lines[i]);
      out += '<p>' + inline(buf.join(' ')) + '</p>';
    }
  }
  return out;
}

const params = new URLSearchParams(location.search);
const cur = params.get('doc');
document.getElementById('side').innerHTML = '<h5>Documentation</h5>' +
  DOCS.map(([n, t]) => '<a href="guide?doc=' + n + '"' + (n === cur ? ' class="on"' : '') + '>' + t + '</a>').join('') +
  '<h5>More</h5><a href="self-hosting">Quick self-hosting guide</a><a href="https://github.com/s0n4jit/e-voting/tree/main/docs/report">Project report (LaTeX)</a>';

const picker = '<label class="docs-pick"><span>Document</span><select onchange="location.href=this.value" aria-label="Choose a document">' +
  '<option value="guide"' + (names.includes(cur) ? '' : ' selected') + '>All documents</option>' +
  DOCS.map(([n, t]) => '<option value="guide?doc=' + n + '"' + (n === cur ? ' selected' : '') + '>' + t + '</option>').join('') + '</select></label>';

const el = document.getElementById('content');
if (!names.includes(cur)) {
  el.innerHTML = picker + '<h1>Documentation</h1><p class="sub">Guides for installing, hosting, running and securing the system.</p><div class="cards">' +
    DOCS.map(([n, t]) => '<a class="dcard" href="guide?doc=' + n + '"><b>' + t + '</b></a>').join('') + '</div>';
} else {
  const title = DOCS.find(d => d[0] === cur)[1];
  document.title = title + ' — Campus E-Voting docs';
  fetch(cur + '.md').then(r => { if (!r.ok) throw 0; return r.text(); })
    .then(t => { el.innerHTML = picker + render(t); if (location.hash) document.getElementById(decodeURIComponent(location.hash.slice(1)))?.scrollIntoView(); })
    .catch(() => { el.innerHTML = picker + '<p>Could not load this document. <a href="' + REPO + 'docs/' + cur + '.md">Open it on GitHub</a>.</p>'; });
}
</script>
<script>if(/\.html$/.test(location.pathname))history.replaceState(null,"",location.pathname.replace(/(^|\/)index\.html$/,"$1").replace(/\.html$/,"")+location.search+location.hash)</script>
<script src="site.js" defer></script>
