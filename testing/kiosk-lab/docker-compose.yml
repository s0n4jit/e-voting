services:
  # ==============================================================================
  # 1. Isolated Test Database (PostgreSQL 15)
  # Guaranteed isolated on custom port 5433 with dedicated database & credentials
  # ==============================================================================
  kiosk_test_db:
    image: postgres:15-alpine
    container_name: kiosk_test_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${TEST_DB_NAME:-evoting_test_db}
      POSTGRES_USER: ${TEST_DB_USER:-evoting_test_user}
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD:-test_db_secret_pass_2026}
    ports:
      - "${HOST_DB_PORT:-5433}:5432"
    volumes:
      - kiosk_test_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TEST_DB_USER:-evoting_test_user} -d ${TEST_DB_NAME:-evoting_test_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 3s
    networks:
      - kiosk_lab_net

  # ==============================================================================
  # 2. Flask Testing Backend
  # Auto-migrates and seeds test election, 9 portfolios, desk officers & STU001-STU020
  # ==============================================================================
  kiosk_test_backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: kiosk_test_backend
    restart: unless-stopped
    depends_on:
      kiosk_test_db:
        condition: service_healthy
    environment:
      FLASK_ENV: ${FLASK_ENV:-development}
      DEBUG: ${DEBUG:-True}
      TESTING: ${TESTING:-False}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SECRET_KEY: ${SECRET_KEY:-kiosk-lab-security-session-secret-key-2026-isolated}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-kiosk-lab-jwt-signing-secret-key-2026-isolated}
      JWT_ACCESS_TOKEN_EXPIRES_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRES_MINUTES:-60}
      DATABASE_URL: ${DATABASE_URL:-postgresql://evoting_test_user:test_db_secret_pass_2026@kiosk_test_db:5432/evoting_test_db}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3001,http://127.0.0.1:3001,http://localhost:3000,http://localhost:8080,http://kiosk_test_frontend}
      BOOTH_ID: ${BOOTH_ID:-BOOTH-LAB-01}
      STAFF_MAINTENANCE_PIN_HASH: ${STAFF_MAINTENANCE_PIN_HASH:-scrypt:32768:8:1$kE6K5B31e8lqRzQ0$30a5ca6fdfdfb1a38c4b1265b6e4e37e90c58e58f00155b1ba7d5635fecae1a84f509e5352c8dfd83d100067713835626a57c50ff3a89046c4f3ce1089869a8e}
      MAINTENANCE_MAX_ATTEMPTS: ${MAINTENANCE_MAX_ATTEMPTS:-5}
      MAINTENANCE_LOCKOUT_SECONDS: ${MAINTENANCE_LOCKOUT_SECONDS:-900}
      RATELIMIT_ENABLED: "False"
      MAIL_SUPPRESS_SEND: "True"
    volumes:
      - ./docker/backend/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    ports:
      - "${HOST_BACKEND_PORT:-5001}:5000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/api/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 8s
    networks:
      kiosk_lab_net:
        aliases:
          - backend

  # ==============================================================================
  # 3. Kiosk Testing Frontend (Nginx + React SPA)
  # Served on port 3001 with reverse proxy to kiosk_test_backend
  # ==============================================================================
  kiosk_test_frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    container_name: kiosk_test_frontend
    restart: unless-stopped
    depends_on:
      kiosk_test_backend:
        condition: service_healthy
    ports:
      - "${HOST_FRONTEND_PORT:-3001}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:80/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      kiosk_lab_net:
        aliases:
          - frontend

  # ==============================================================================
  # 4. Linux Kiosk GUI Simulator (Alpine X11 + Chromium Kiosk + noVNC Web GUI)
  # Open http://localhost:8080 in Windows browser to interact with Linux kiosk!
  # ==============================================================================
  kiosk_browser_novnc:
    build:
      context: ./docker/kiosk-browser
      dockerfile: Dockerfile
    container_name: kiosk_browser_novnc
    restart: unless-stopped
    depends_on:
      kiosk_test_frontend:
        condition: service_healthy
    environment:
      KIOSK_TARGET_URL: http://kiosk_test_frontend/kiosk
    ports:
      - "${HOST_NOVNC_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - kiosk_lab_net

  # ==============================================================================
  # 5. Network Chaos & Failure Simulator Daemon
  # Injects latency, severed connection, or DNS failure for resilience diagnostics
  # ==============================================================================
  kiosk_network_simulator:
    build:
      context: ./docker/network-simulator
      dockerfile: Dockerfile
    container_name: kiosk_network_simulator
    restart: unless-stopped
    ports:
      - "${HOST_NET_SIM_PORT:-8090}:8090"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8090/health')\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 3s
    networks:
      - kiosk_lab_net

networks:
  kiosk_lab_net:
    name: kiosk_lab_net
    driver: bridge

volumes:
  kiosk_test_db_data:
    name: kiosk_test_db_data
